name: CI

# Runner do GitHub (repo público, sem custo): não ocupa o runner self-hosted da org.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check
      - run: npm test
